[project]
name = "cfip-pro"
version = "0.1.0"
description = "CFIP-PRO: modular Python-first financial market intelligence platform"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.54",
  "alembic==1.20.0",
  "asyncpg>=0.30,<1",
  "nats-py>=2.11,<3",
  "redis==8.1.0",
  "TA-Lib==0.8.0",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio>=1.2,<2",
  "ruff==0.16.8",
  "mypy>=1.17,<2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/cfip"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["apps/api/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests that require a live external service such as PostgreSQL",
]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = ["apps/api/src"]
