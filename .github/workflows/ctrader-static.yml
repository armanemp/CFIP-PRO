name: cTrader static architecture tests

on:
  push:
    paths:
      - "integrations/ctrader/**"
      - "tests/unit/test_ctrader_v79_phase6_decision.py"
      - "tests/unit/test_ctrader_v80_phase7_entry.py"
      - ".github/workflows/ctrader-static.yml"
  pull_request:
    paths:
      - "integrations/ctrader/**"
      - "tests/unit/test_ctrader_v79_phase6_decision.py"
      - "tests/unit/test_ctrader_v80_phase7_entry.py"
      - ".github/workflows/ctrader-static.yml"

jobs:
  python-static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run cTrader architecture tests
        run: python -m pytest tests/unit/test_ctrader_v79_phase6_decision.py tests/unit/test_ctrader_v80_phase7_entry.py -q
