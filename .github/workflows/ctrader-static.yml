name: cTrader static architecture tests

on:
  push:
    paths:
      - "integrations/ctrader/**"
      - "tests/unit/test_ctrader_v79_phase6_decision.py"
      - "tests/unit/test_ctrader_v80_phase7_entry.py"
      - "tests/unit/test_ctrader_v81_phase8_risk_targets.py"
      - "tests/unit/test_ctrader_v82_phase9_execution.py"
      - "tests/unit/test_ctrader_v83_phase10_pending.py"
      - "tests/unit/test_ctrader_v84_phase11_position.py"
      - "tests/unit/test_ctrader_v85_phase11_reaudit.py"
      - "tests/unit/test_ctrader_v86_phase11_lifecycle.py"
      - "tests/unit/test_ctrader_v87_phase12_live_management.py"
      - ".github/workflows/ctrader-static.yml"
  pull_request:
    paths:
      - "integrations/ctrader/**"
      - "tests/unit/test_ctrader_v79_phase6_decision.py"
      - "tests/unit/test_ctrader_v80_phase7_entry.py"
      - "tests/unit/test_ctrader_v81_phase8_risk_targets.py"
      - "tests/unit/test_ctrader_v82_phase9_execution.py"
      - "tests/unit/test_ctrader_v83_phase10_pending.py"
      - ".github/workflows/ctrader-static.yml"

jobs:
  python-static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run cTrader architecture tests
        run: python -m pytest tests/unit/test_ctrader_v79_phase6_decision.py tests/unit/test_ctrader_v80_phase7_entry.py tests/unit/test_ctrader_v81_phase8_risk_targets.py tests/unit/test_ctrader_v82_phase9_execution.py tests/unit/test_ctrader_v83_phase10_pending.py tests/unit/test_ctrader_v84_phase11_position.py tests/unit/test_ctrader_v85_phase11_reaudit.py tests/unit/test_ctrader_v86_phase11_lifecycle.py -q
