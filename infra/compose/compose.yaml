services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: cfip
      POSTGRES_USER: cfip
      POSTGRES_PASSWORD: ${CFIP_POSTGRES_PASSWORD:?set CFIP_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cfip-postgres:/var/lib/postgresql/data

  nats:
    image: nats:2.14.7-alpine
    command: ["-js"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"

  redis:
    image: redis:8.2-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  cfip-postgres:
